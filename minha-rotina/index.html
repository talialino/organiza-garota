<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf1ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Minha Rotina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Dancing+Script:wght@500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script>
/* Paleta: cada cor guarda sua luminosidade; o tema só troca o tom (matiz) e a saturação. */
(function(){
  const P = {
    'bg':[14,64,96], 'card':[12,100,98], 'paper':[17,100,99], 'cardw':[20,100,99.4],
    'line':[9,47,88], 'rule':[9,28,81], 'pink':[2,74,90], 'pink-soft':[5,81,95],
    'accent':[349,68,72], 'accent-d':[349,55,60], 'ink':[0,15,16], 'ink2':[0,13,31], 'muted':[9,15,60],
    'uline':[9,17,70], 'chk':[8,8,52], 'bul':[7,13,48], 'tbh-line':[0,63,84], 'hrbg':[5,79,97], 'focus':[0,100,98],
    'edge1':[13,48,92], 'edge2':[12,41,88], 'blank':[9,48,92],
    'heart':[352,77,80], 'heart2':[354,82,75], 'heart-soft':[355,88,94],
    'ico':[0,14,37], 'leaf':[8,15,47], 'ill1':[357,74,87], 'ill2':[354,74,83], 'ill3':[353,58,81]
  };
  const TUP = { 'sh1':[0,26,37], 'sh2':[0,20,49], 'sh3':[0,33,24], 'ov':[0,33,18], 'acc':[349,68,72] };
  const THEMES = { rosa:{h:0,sf:1}, bege:{h:41,sf:.68}, azul:{h:216,sf:.9} };
  const ACC_H = 349, ACC_S = 68;
  function hexToHsl(hex){
    const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx + mn) / 2, d = mx - mn;
    let h = 0, s = 0;
    if (d) {
      s = d / (1 - Math.abs(2 * l - 1));
      h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    return [h, s * 100, l * 100];
  }
  function params(t){
    if (t && t.id === 'custom' && /^#[0-9a-f]{6}$/i.test(t.color || '')) {
      const [h, s] = hexToHsl(t.color);
      return { h: (h - ACC_H + 360) % 360, sf: Math.max(.12, Math.min(1.4, s / ACC_S)) };
    }
    return THEMES[t && t.id] || THEMES.rosa;
  }
  window.applyTheme = function(t){
    const { h, sf } = params(t), st = document.documentElement.style;
    const c = ([hh, s, l]) => [Math.round((hh + h) % 360), Math.min(100, s * sf).toFixed(1) + '%', l + '%'];
    for (const [k, v] of Object.entries(P)) { const [a, b, l] = c(v); st.setProperty('--' + k, `hsl(${a} ${b} ${l})`); }
    for (const [k, v] of Object.entries(TUP)) st.setProperty('--' + k, c(v).join(', '));
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#fbf1ee';
  };
  let t = null;
  try { t = (JSON.parse(localStorage.getItem('minha-rotina-v2') || 'null') || {}).theme; } catch(e) {}
  applyTheme(t);
})();
</script>
<style>
:root{
  --f-title:'Fraunces',Georgia,serif; --f-script:'Dancing Script',cursive; --f-body:'Quicksand',system-ui,sans-serif; --f-hand:'Caveat',cursive;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
svg{display:block}
input{font-family:var(--f-body);font-weight:500}

/* ---------- barra superior ---------- */
.app{max-width:1120px;margin:0 auto;padding:20px 20px 44px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;margin-bottom:14px}
.week{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.week span{font-weight:700;font-size:14px;color:var(--ink2);padding:0 8px;white-space:nowrap}
.week button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:19px;line-height:1;color:var(--ink2)}
.week button:hover{background:var(--pink-soft)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 15px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.btn svg{width:17px;flex:none}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn[hidden]{display:none}

.daynav{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 18px}
.arrow{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center;color:var(--ink2);flex:none}
.arrow:disabled{opacity:.35;cursor:default}
.chip{position:relative;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:14px;color:var(--ink2);flex:none;padding:0}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.today::after{content:'';position:absolute;bottom:-8px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.sidetabs{display:none;width:max-content;margin:-4px auto 16px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.sidetabs button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink2);cursor:pointer}
.sidetabs button.on{background:var(--pink);color:var(--ink)}
body.is-single .sidetabs{display:flex}

/* ---------- livro aberto ---------- */
.book{position:relative;display:grid;grid-template-columns:1fr 1fr;perspective:2800px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.book input{-webkit-user-select:text;user-select:text}
.book::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:hsla(var(--sh2),.2);z-index:5;pointer-events:none}
.slot{display:flex;flex-direction:column;min-width:0}
.pg{display:none;position:relative;flex:1;flex-direction:column;background-color:var(--paper);border:1px solid var(--line)}
.pg.on{display:flex}
.pg-l{border-radius:22px 3px 3px 22px;border-right:0;background-image:linear-gradient(270deg,hsla(var(--sh2),.14),hsla(var(--sh2),0) 50px);box-shadow:-3px 3px 0 -1px var(--edge1),-6px 6px 0 -2px var(--edge2),0 20px 40px -26px hsla(var(--sh1),.45)}
.pg-r{border-radius:3px 22px 22px 3px;background-image:linear-gradient(90deg,hsla(var(--sh2),.14),hsla(var(--sh2),0) 50px);box-shadow:3px 3px 0 -1px var(--edge1),6px 6px 0 -2px var(--edge2),0 20px 40px -26px hsla(var(--sh1),.45)}
.pg-blank{background:repeating-linear-gradient(var(--paper) 0 33px,var(--blank) 33px 34px);border-radius:3px 22px 22px 3px}

.flip{position:absolute;top:0;left:50%;width:50%;z-index:20;display:flex;transform-origin:left center;transform-style:preserve-3d;pointer-events:none;will-change:transform}
.face{display:flex;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{position:relative;flex:1;border-radius:3px 22px 22px 3px}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);border-radius:22px 3px 3px 22px}
.face>.pg{display:flex;flex:1;box-shadow:none}
.face::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.face.front::after{background:linear-gradient(90deg,hsla(var(--sh3),.3),hsla(var(--sh3),.06));opacity:var(--shf,0)}
.face.back::after{background:linear-gradient(270deg,hsla(var(--sh3),.3),hsla(var(--sh3),.06));opacity:var(--shb,0)}

/* ferramentas da página */
.tools{position:absolute;top:12px;display:flex;gap:6px;z-index:3}
.pg-l .tools{left:18px}
.pg-r .tools{right:18px}
.tbtn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--cardw);font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer}
.tbtn svg{width:14px}
.tbtn:hover{border-color:var(--accent);color:var(--accent-d)}
.tbtn.dim{opacity:.45}

/* ---------- página esquerda (Meu Dia) ---------- */
.sheet-l{flex:1;display:flex;flex-direction:column;padding:52px 22px 20px}
.l-head{position:relative;text-align:center;margin-bottom:18px}
.rays{width:56px;margin:0 auto 2px}
.l-head h1{font-family:var(--f-title);font-weight:400;font-size:60px;line-height:1;margin:0;letter-spacing:-.02em}
.l-head .sub{font-size:21px;font-weight:600;margin:10px 0 0;color:var(--ink2)}
.script{font-family:var(--f-script);color:var(--accent);font-weight:600}
.l-head .script{font-size:34px;line-height:1.15;margin:0}
.l-head .heart-deco{position:absolute;right:0;top:100px;width:44px;transform:rotate(-8deg)}

.card{background:var(--cardw);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.date-card{display:flex;align-items:center;gap:10px;background:var(--pink-soft);padding:12px 16px}
.lbl{font-weight:700;font-size:15px;letter-spacing:.04em}
.date-in{display:flex;align-items:flex-end;gap:4px}
.date-in input{width:44px;border:0;border-bottom:1.2px solid var(--uline);background:transparent;font-size:16px;text-align:center;color:var(--ink);padding:2px 0;outline:none;border-radius:0;cursor:default}
.date-in input.yy{width:64px}
.date-in span{color:var(--ink2)}
.cal{width:38px;margin-left:auto;flex:none}

.sec-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.05em;margin:2px 0 8px}
.sec-title svg{width:28px;flex:none}
.row{display:flex;align-items:center;gap:12px;padding:5px 0}
.ln{flex:1;min-width:0;border:0;border-bottom:1.2px solid var(--rule);background:transparent;font-size:16px;color:var(--ink);padding:5px 2px;outline:none;border-radius:0}
.ln:focus{border-bottom-color:var(--accent)}
.row:has(.chk:checked) .ln{text-decoration:line-through;color:var(--muted)}

.chk{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.6px solid var(--chk);border-radius:4px;flex:none;display:grid;place-content:center;background:#fff;cursor:pointer;margin:0}
.chk.round{border-radius:50%}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:'';width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

.routine{position:relative;padding:0;margin-top:34px}
.routine .pill{position:absolute;top:-18px;left:15%;width:62%;background:var(--pink);padding:7px 0;text-align:center;font-weight:700;letter-spacing:.06em;font-size:16px;border-radius:6px}
.routine .clock{position:absolute;top:-26px;right:7%;width:46px}
.r-list{padding-top:22px}
.r-row{display:grid;grid-template-columns:32px minmax(0,1fr) 84px;align-items:center;gap:10px;padding:0 0 0 14px;border-bottom:1px solid var(--line);min-height:46px}
.r-row:last-child{border-bottom:0}
.r-row svg{width:30px}
.r-ic{border:0;background:transparent;padding:0;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;border-radius:8px}
.r-ic:hover{background:var(--pink-soft)}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:4px 0 16px}
.icons button{aspect-ratio:1;border:1px solid var(--line);background:var(--cardw);border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:8px}
.icons button svg{width:30px}
.icons button.on{border-color:var(--accent);box-shadow:0 0 0 2px hsla(var(--acc),.35)}
.wide-mob .bscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;margin:0 -10px;padding:0 10px 26px}
.wide-mob .book{min-width:860px;touch-action:auto}
#bView{display:none}
.r-title{border:0;background:transparent;font-size:16px;color:var(--ink);outline:none;min-width:0;width:100%;padding:8px 0;border-radius:0}
.r-title:focus{box-shadow:inset 0 -1.5px 0 var(--accent)}
.r-time{align-self:stretch;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.r-time input{width:76px;border:0;background:transparent;font-size:15px;color:var(--ink);text-align:center;outline:none;min-height:30px;padding:0}

.lem .sec-title{justify-content:center;position:relative;padding:4px 0}
.lem .sec-title svg{position:absolute;right:0;top:-2px;width:34px}
.bul{width:6px;height:6px;border-radius:50%;background:var(--bul);flex:none}

.foot{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--pink-soft);border-radius:999px;padding:10px 20px;font-family:var(--f-hand);font-weight:500;font-size:24px;color:var(--ink2);text-align:center;line-height:1.1;margin-top:auto}
.foot svg{width:30px;flex:none}
.foot .leaf-sm{width:40px}

/* ---------- página direita (Plano do Dia) ---------- */
.sheet-r{flex:1;display:flex;flex-direction:column;padding:52px 22px 20px 30px}
.r-head{position:relative;text-align:center;margin-bottom:16px}
.r-head h2{font-family:var(--f-title);font-weight:400;font-size:46px;letter-spacing:.04em;margin:0;line-height:1.05;text-transform:uppercase;display:inline-flex;align-items:flex-start;gap:6px}
.r-head h2 svg{width:32px;margin-top:2px}
.r-head .script{font-size:25px;line-height:1.2;margin:8px 0 0}
.r-head .leaf{position:absolute;right:-6px;bottom:-4px;width:54px}
.date-r{display:flex;align-items:center;gap:14px;max-width:370px;width:100%;margin:0 auto 16px;background:var(--cardw);padding:12px 18px}

.tbl{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--cardw);margin-bottom:14px}
.tbl-h{display:grid;grid-template-columns:96px minmax(0,1fr);background:var(--pink);font-weight:700;font-size:15px;letter-spacing:.05em}
.tbl-h div{padding:12px 8px}
.tbl-h div:first-child{border-right:1px solid var(--tbh-line);text-align:center}
.tbl-h div:last-child{display:flex;align-items:center;justify-content:center;position:relative}
.tbl-h svg{position:absolute;right:12px;width:24px}
.tr{display:grid;grid-template-columns:96px minmax(0,1fr);border-top:1px solid var(--line);min-height:45px}
.tr .hr{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:var(--hrbg);border-right:1px solid var(--line)}
.tr input{border:0;background:transparent;font-size:16px;color:var(--ink);padding:0 14px;outline:none;min-width:0;width:100%}
.tr input:focus{background:var(--focus)}

.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.duo .ln{width:100%}
.duo .card{padding:12px 14px}
.duo .sec-title{font-size:13px;justify-content:center;gap:8px}
.duo .sec-title svg{width:22px}
.mini-heart{width:14px;flex:none}

/* ---------- avisos e janelas ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;z-index:3000;width:max-content;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.mwrap{position:fixed;inset:0;background:hsla(var(--ov),.36);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .2s}
.mwrap.on{opacity:1}
.modal{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 20px 20px;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 60px -30px hsla(var(--sh3),.55)}
.modal h3{font-family:var(--f-title);font-weight:400;font-size:26px;margin:0 0 6px;text-align:center}
.modal p{margin:0 0 16px;color:var(--ink2);font-size:15px;line-height:1.45;text-align:center}
.modal ul{list-style:none;margin:0 0 18px;padding:0;color:var(--ink2);font-size:15px;line-height:1.6;text-align:center}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 16px}
.hslot{position:relative;aspect-ratio:1;border:1.6px dashed var(--rule);border-radius:16px;background:var(--cardw);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 6px;text-align:center;cursor:pointer;font-size:12px;color:var(--muted);outline:none;transition:box-shadow .15s,border-color .15s}
.hslot .n{font-family:var(--f-title);font-size:28px;color:var(--accent);line-height:1}
.hslot b{font-size:13px;color:var(--ink)}
.hslot.full{border-style:solid;border-color:var(--line);background:var(--pink-soft);color:var(--ink2)}
.hslot:hover,.hslot:focus-visible{border-color:var(--accent)}
.hslot.sel{border-color:var(--accent);border-style:solid;box-shadow:0 0 0 3px hsla(var(--acc),.35)}
.hslot .x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--cardw);color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0}
.warn{color:var(--accent-d);font-size:14px;font-weight:700;margin:-6px 0 14px;text-align:center}
.warn[hidden]{display:none}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* cores */
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 18px}
.th{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink2);padding:0}
.sw{width:54px;height:54px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);display:block;position:relative;overflow:hidden}
.th.on .sw{box-shadow:0 0 0 3px var(--accent)}
.sw.custom{background:conic-gradient(#f4a7b5,#f6d38a,#b9e0a5,#a8d4f0,#c8b4ec,#f4a7b5)}
.sw input{position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);opacity:0;cursor:pointer;border:0;padding:0}

/* ---------- celular: uma página por vez ---------- */
.book.single{display:block}
.book.single::after{display:none}
.single[data-side="l"] .slot-r,.single[data-side="r"] .slot-l{display:none}
.single .pg{border-radius:3px 22px 22px 3px;border:1px solid var(--line);background-image:linear-gradient(90deg,hsla(var(--sh2),.13),hsla(var(--sh2),0) 34px);box-shadow:3px 3px 0 -1px var(--edge1),6px 6px 0 -2px var(--edge2),0 20px 40px -26px hsla(var(--sh1),.45)}
.single .pg-l .tools{left:auto;right:16px}
.single .flip{left:0;width:100%}

@media (max-width:899px){
  .app{padding:12px 10px calc(30px + env(safe-area-inset-bottom))}
  .topbar{justify-content:center}
  #bView{display:inline-flex}
  .btn{padding:8px 12px;font-size:13px}
  .sheet-l{padding:50px 16px 18px 20px}
  .sheet-r{padding:50px 14px 16px 20px}
  .l-head h1{font-size:52px}
  .l-head .heart-deco{top:30px;right:2px;width:36px}
  .r-head h2{font-size:clamp(30px,9.5vw,44px)}
  .r-head .script{font-size:22px}
  .r-head .leaf{width:42px;right:-4px}
  .tbl-h,.tr{grid-template-columns:76px minmax(0,1fr)}
  .tbl-h div:last-child{font-size:13px;padding-right:34px}
  .foot{font-size:21px;padding:9px 14px}
}
@media (max-width:370px){ .duo{grid-template-columns:minmax(0,1fr)} .chip{width:30px;height:30px} .arrow{width:32px;height:32px} .sw{width:46px;height:46px} }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="week">
      <button id="wPrev" aria-label="Semana anterior">‹</button>
      <span id="wLbl"></span>
      <button id="wNext" aria-label="Próxima semana">›</button>
    </div>
    <div class="acts">
      <button class="btn" id="bNew">Nova semana</button>
      <button class="btn" id="bHist">Histórico</button>
      <button class="btn" id="bTheme">Cor</button>
      <button class="btn" id="bView"></button>
      <button class="btn" id="bInst">Instalar</button>
    </div>
  </header>
  <nav class="daynav" id="nav"></nav>
  <div class="sidetabs" id="tabs"><button data-s="0">Meu Dia</button><button data-s="1">Plano</button></div>

    <div class="book" id="book">
      <div class="slot slot-l" id="slotL"></div>
      <div class="slot slot-r" id="slotR"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const KEY = 'minha-rotina-v2', OLD = 'minha-rotina-v1';
const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const INI = ['D','S','T','Q','Q','S','S'];
const range = n => Array.from({length:n}, (_, i) => i);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fmt = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
const weekRange = ws => { const a = parse(ws); return `${fmt(a)} – ${fmt(addDays(a, 6))}`; };
const now = new Date(), todayIdx = now.getDay();
const thisSunday = iso(addDays(now, -todayIdx));
const empty = v => v === '' || v === false || v == null;

/* ---------- dados ---------- */
let S = { weekStart: thisSunday, f: {}, hist: [null,null,null], clip: null, theme: { id: 'rosa' } };
function migrate(old){
  const f = {};
  for (const [k, v] of Object.entries(old)) {
    if (empty(v)) continue;
    let m;
    if ((m = k.match(/^l\.(r\d+[th])$/))) range(7).forEach(d => f[`L${d}.${m[1]}`] = v);
    else if ((m = k.match(/^l\.([pm]\d+c?)$/))) f[`L${todayIdx}.${m[1]}`] = v;
    else if ((m = k.match(/^d(\d)\.([hogn].*)$/))) f[`R${m[1]}.${m[2]}`] = v;
  }
  return f;
}
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const o = JSON.parse(raw); if (o && o.f) S = Object.assign(S, o); }
  else { const old = JSON.parse(localStorage.getItem(OLD) || 'null'); if (old) S.f = migrate(old); }
} catch(e) {}
S.hist = range(3).map(i => (Array.isArray(S.hist) && S.hist[i]) || null);
if (!S.theme) S.theme = { id: 'rosa' };

let tm;
function flush(){ clearTimeout(tm); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function save(){ clearTimeout(tm); tm = setTimeout(flush, 250); }
addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

/* ---------- desenhos (as cores seguem o tema) ---------- */
const fillV = v => `style="fill:var(--${v})"`;
const svg = (inner, vb='0 0 32 32') => `<svg viewBox="${vb}" fill="none" stroke="currentColor" style="color:var(--ico)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const pk = (inner, vb='0 0 32 32', w=2) => `<svg viewBox="${vb}" fill="none" stroke="currentColor" style="color:var(--accent)" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ic = inner => `<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const HP = 'M16 27C9 22 4 17.5 4 12a6 6 0 0 1 12-2 6 6 0 0 1 12 2c0 5.5-5 10-12 15z';
const LEAF_PATHS = '<path d="M8 54C20 40 32 26 50 6"/><path d="M18 42c-1-7 2-12 7-14 1 6-2 11-7 14z"/><path d="M18 42c-7 0-11-3-13-8 6-1 11 2 13 8z"/><path d="M28 30c-1-7 2-12 7-14 1 6-2 11-7 14z"/><path d="M28 30c-7 0-11-3-13-8 6-1 11 2 13 8z"/><path d="M38 18c-1-6 2-10 6-12 1 5-1 9-6 12z"/><path d="M38 18c-6 0-9-3-11-7 5-1 9 2 11 7z"/>';
const leafSvg = (v, w) => `<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" style="color:var(--${v})" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${LEAF_PATHS}</svg>`;

const D = {
  heart: pk(`<path d="${HP}"/>`),
  heartFill: `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="${HP}" ${fillV('heart')}/></svg>`,
  rays: pk('<path d="M14 24 8 13M30 19V5M46 24l6-11"/>', '0 0 60 30', 3),
  star: pk(`<path d="M16 3.5l3.7 7.6 8.3 1.2-6 5.9 1.4 8.3L16 22.6l-7.4 3.9 1.4-8.3-6-5.9 8.3-1.2z" ${fillV('heart-soft')}/>`, '0 0 32 32', 1.8),
  cal: pk(`<rect x="4" y="7" width="24" height="21" rx="3" ${fillV('heart-soft')}/><path d="M4 13h24M10 4v6M22 4v6"/><g stroke="none" style="fill:var(--accent)"><rect x="8" y="16" width="3" height="3" rx=".6"/><rect x="14.5" y="16" width="3" height="3" rx=".6"/><rect x="21" y="16" width="3" height="3" rx=".6"/><rect x="8" y="21.5" width="3" height="3" rx=".6"/><rect x="14.5" y="21.5" width="3" height="3" rx=".6"/><rect x="21" y="21.5" width="3" height="3" rx=".6"/></g>`, '0 0 32 32', 1.8),
  clock: pk('<circle cx="16" cy="18" r="10" fill="#fff"/><path d="M16 12v6.5l3 2M10 27l-1.5 2M22 27l1.5 2M5.5 9.5a4 4 0 0 1 5-4.5M26.5 9.5a4 4 0 0 0-5-4.5"/>', '0 0 32 32', 1.8),
  target: pk('<circle cx="15" cy="17" r="11"/><circle cx="15" cy="17" r="6.5"/><circle cx="15" cy="17" r="2" style="fill:var(--accent)"/><path d="M15 17 26 6M22 5.5h4.5V10"/>', '0 0 32 32', 1.8),
  pencil: svg('<path d="M6 26l1.5-6L21 6.5a2.1 2.1 0 0 1 3 0l1.5 1.5a2.1 2.1 0 0 1 0 3L12 24.5z"/><path d="M19 8.5l4.5 4.5M7.5 20l4.5 4.5"/>'),
  leaf: leafSvg('leaf', 1.4),
  leafPink: leafSvg('accent', 1.6)
};
const T = {
  copy: ic('<rect x="11" y="11" width="15" height="16" rx="2.5"/><path d="M7 21V8a2.5 2.5 0 0 1 2.5-2.5H20"/>'),
  paste: ic('<rect x="7" y="6.5" width="18" height="21" rx="2.5"/><rect x="12" y="4" width="8" height="5" rx="1.3"/><path d="M12 15h8M12 19.5h8M12 24h5"/>'),
  erase: ic('<path d="M13 27h14"/><path d="M5.5 19.5 17 8a2.5 2.5 0 0 1 3.5 0l4 4a2.5 2.5 0 0 1 0 3.5L14 26.5H11z"/><path d="M11 14l7.5 7.5"/>'),
  fresh: ic('<path d="M16 4v6M16 22v6M4 16h6M22 16h6M7.5 7.5l4 4M20.5 20.5l4 4M24.5 7.5l-4 4M11.5 20.5l-4 4"/>'),
  hist: ic('<path d="M5 16a11 11 0 1 0 3.2-7.8"/><path d="M5 5v5h5"/><path d="M16 10v6.5l4 2.5"/>'),
  palette: ic('<path d="M16 4a12 12 0 0 0 0 24c1.7 0 2.5-1 2.5-2.3 0-1.8-1.5-2.4-1.5-3.9 0-1.2 1-2 2.3-2H22a6 6 0 0 0 6-6C28 8.6 22.6 4 16 4z"/><circle cx="10" cy="15" r="1.4" fill="currentColor"/><circle cx="13" cy="9.5" r="1.4" fill="currentColor"/><circle cx="19.5" cy="9.5" r="1.4" fill="currentColor"/>'),
  bookI: ic('<path d="M16 8c-3-2-8-2-12-1v18c4-1 9-1 12 1 3-2 8-2 12-1V7c-4-1-9-1-12 1z"/><path d="M16 8v18"/>'),
  pageI: ic('<rect x="8" y="4" width="16" height="24" rx="2.5"/><path d="M12 11h8M12 16h8M12 21h5"/>'),
  down: ic('<path d="M16 4v16M9.5 13.5 16 20l6.5-6.5"/><path d="M6 27h20"/>')
};

const I = {
  sun: svg('<path d="M12 5v2.5M5 8.5l1.7 1.7M2.5 15.5H5M19 8.5l-1.7 1.7"/><circle cx="12" cy="16" r="5" fill="#f9d77e"/><path d="M9 26h15a4 4 0 0 0 0-8 6 6 0 0 0-11.3 1.5A3.3 3.3 0 0 0 9 26z" fill="#fdf8f4"/>'),
  med: svg(`<circle cx="16" cy="7" r="3" fill="#f6d5c3"/><path d="M12 21v-6a4 4 0 0 1 8 0v6" ${fillV('ill1')}/><path d="M12 15l-4 5 4 1.5M20 15l4 5-4 1.5"/><path d="M5 25c3-3.5 19-3.5 22 0-4 2.5-18 2.5-22 0z" ${fillV('ill2')}/>`),
  cup: svg('<path d="M12 4.5c-1 2 1 3 0 5M16 4c-1 2 1 3 0 5"/><path d="M7 13h15v5a6 6 0 0 1-6 6h-3a6 6 0 0 1-6-6z" fill="#fff"/><path d="M7.5 16.5h14" style="stroke:var(--accent)"/><path d="M22 15h2a2.5 2.5 0 0 1 0 5h-2.5M5 27h21"/>'),
  note: svg('<rect x="8" y="5" width="16" height="22" rx="1.5" fill="#dcd6d0"/><path d="M11.5 5v22M14.5 10.5h6M14.5 14.5h6M14.5 18.5h4"/>'),
  gym: svg('<path d="M9 16h14"/><rect x="5.5" y="10" width="3.5" height="12" rx="1" fill="#9a8f8f"/><rect x="23" y="10" width="3.5" height="12" rx="1" fill="#9a8f8f"/><rect x="2.5" y="12.5" width="3" height="7" rx="1" fill="#c7bebe"/><rect x="26.5" y="12.5" width="3" height="7" rx="1" fill="#c7bebe"/>'),
  bowl: svg('<circle cx="11" cy="14" r="3" fill="#a8cf8e"/><circle cx="16" cy="11.5" r="3.2" fill="#f19a8a"/><circle cx="21" cy="14" r="3" fill="#f7d36b"/><path d="M4.5 16h23c0 6-5 10-11.5 10S4.5 22 4.5 16z" fill="#f4c27a"/>'),
  book: svg('<path d="M16 9c-3-2-7-2-11-1v16c4-1 8-1 11 1 3-2 7-2 11-1V8c-4-1-8-1-11 1z" fill="#fff"/><path d="M16 9v16M8 12.5h5M8 16h5M19 12.5h5M19 16h5"/>'),
  laptop: svg('<rect x="7" y="7.5" width="18" height="12.5" rx="1.5" fill="#cfd8de"/><path d="M4 23h24l-2 3H6z" fill="#8f8a8a"/>'),
  apple: svg('<path d="M16 11c-2-2-8-2-9 4s3 12 6 12c1.5 0 2-.7 3-.7s1.5.7 3 .7c3 0 7-6 6-12s-7-6-9-4z" fill="#f07e7e"/><path d="M16 11c0-3 1-5 3-6"/><path d="M17.5 8c2-3 5-3 6-2-1 2-4 3-6 2z" fill="#9cc886"/>'),
  heart: svg(`<path d="${HP}" ${fillV('heart2')}/>`),
  pot: svg('<path d="M7 14h18v7a5 5 0 0 1-5 5h-8a5 5 0 0 1-5-5z" fill="#f1b9a0"/><path d="M6 14c0-3 4-5 10-5s10 2 10 5z" fill="#f6cdb9"/><circle cx="16" cy="7.5" r="1.4"/><path d="M7 17H4M25 17h3"/>'),
  clip: svg(`<rect x="8" y="6" width="16" height="21" rx="2" fill="#fff"/><rect x="12" y="4" width="8" height="4" rx="1" ${fillV('ill3')}/><path d="M11.5 13h1.5M15.5 13h5.5M11.5 17h1.5M15.5 17h5.5M11.5 21h1.5M15.5 21h5.5"/>`),
  moon: svg('<path d="M19 5a10 10 0 1 0 8 15A8 8 0 0 1 19 5z" fill="#f3efe9"/><path d="M25 6v3M23.5 7.5h3M27.5 12v2M26.5 13h2"/>')
};

const ROTINA = [
  ['sun','Acordar'],['med','Alongamento / Meditação'],['cup','Café da manhã'],['note','Estudos / Trabalho'],
  ['gym','Academia'],['bowl','Almoço'],['book','Leitura / Desenvolvimento'],['laptop','Trabalho / Projetos'],
  ['apple','Lanche da tarde'],['heart','Tempo pessoal'],['pot','Jantar'],['clip','Planejamento do dia seguinte'],['moon','Hora de dormir']
];
const HOURS = range(17).map(i => pad(i + 6) + ':00');

/* ---------- páginas ---------- */
const dateBox = d => `<div class="date-in" data-date="${d}"><input class="dd" readonly tabindex="-1" aria-label="Dia"><span>/</span><input class="mm" readonly tabindex="-1" aria-label="Mês"><span>/</span><input class="yy" readonly tabindex="-1" aria-label="Ano"></div>`;
const tools = (s, d) => `<div class="tools">
  <button class="tbtn" data-act="copy" data-side="${s}" data-d="${d}">${T.copy}Copiar</button>
  <button class="tbtn" data-act="paste" data-side="${s}" data-d="${d}">${T.paste}Colar</button>
  <button class="tbtn" data-act="clear" data-side="${s}" data-d="${d}">${T.erase}Limpar</button></div>`;

const leftPage = d => `<section class="pg pg-l" data-side="L" data-d="${d}" aria-label="Meu Dia, ${DIAS[d]}">
  ${tools('L', d)}
  <div class="sheet-l">
    <header class="l-head">
      <div class="rays">${D.rays}</div>
      <h1>Meu Dia</h1>
      <p class="sub">Hoje é uma página em branco,</p>
      <p class="script">escreva algo bonito!</p>
      <div class="heart-deco">${D.heart}</div>
    </header>
    <div class="card date-card"><span class="lbl">DATA:</span>${dateBox(d)}<div class="cal">${D.cal}</div></div>
    <section class="card">
      <div class="sec-title">${D.star}PRIORIDADES DO DIA</div>
      ${range(3).map(i => `<label class="row"><input type="checkbox" class="chk" data-k="L${d}.p${i}c" aria-label="Concluída"><input class="ln" data-k="L${d}.p${i}" aria-label="Prioridade ${i+1}"></label>`).join('')}
    </section>
    <section class="card routine">
      <div class="pill">MINHA ROTINA</div>
      <div class="clock">${D.clock}</div>
      <div class="r-list">
        ${ROTINA.map(([icn, t], i) => `<div class="r-row"><button class="r-ic" data-ik="L${d}.r${i}i" data-def="${icn}" aria-label="Trocar ícone">${I[icn]}</button><input class="r-title" data-k="L${d}.r${i}t" data-def="${t}" aria-label="Atividade"><div class="r-time"><input type="time" data-k="L${d}.r${i}h" aria-label="Horário de ${t}"></div></div>`).join('')}
      </div>
    </section>
    <section class="card lem">
      <div class="sec-title">LEMBRETES IMPORTANTES${D.heart}</div>
      ${range(4).map(i => `<div class="row"><span class="bul"></span><input class="ln" data-k="L${d}.m${i}" aria-label="Lembrete ${i+1}"></div>`).join('')}
    </section>
    <div class="foot">${D.heart}<span>Constância vale mais que pressa.</span></div>
  </div>
</section>`;

const rightPage = d => `<section class="pg pg-r" data-side="R" data-d="${d}" aria-label="Plano do Dia, ${DIAS[d]}">
  ${tools('R', d)}
  <div class="sheet-r">
    <header class="r-head">
      <h2>${DIAS[d]}${D.heart}</h2>
      <p class="script">Planeje com calma,<br>viva com intenção.</p>
      <div class="leaf">${D.leaf}</div>
    </header>
    <div class="card date-r"><span class="lbl">DATA:</span>${dateBox(d)}</div>
    <div class="tbl">
      <div class="tbl-h"><div>HORÁRIO</div><div>O QUE VOU FAZER?${D.heart}</div></div>
      ${HOURS.map(h => `<div class="tr"><div class="hr">${h}</div><input data-k="R${d}.h${h}" aria-label="${DIAS[d]} ${h}"></div>`).join('')}
    </div>
    <section class="card">
      <div class="sec-title" style="font-size:15px">${D.target}OBJETIVOS DO DIA</div>
      ${range(3).map(i => `<label class="row"><input type="checkbox" class="chk round" data-k="R${d}.o${i}c" aria-label="Concluído"><input class="ln" data-k="R${d}.o${i}" aria-label="Objetivo ${i+1}"></label>`).join('')}
    </section>
    <div class="duo">
      <section class="card">
        <div class="sec-title">GRATIDÃO DO DIA</div>
        ${range(3).map(i => `<div class="row"><span class="mini-heart">${D.heartFill}</span><input class="ln" data-k="R${d}.g${i}" aria-label="Gratidão ${i+1}"></div>`).join('')}
      </section>
      <section class="card">
        <div class="sec-title">ANOTAÇÕES${D.pencil}</div>
        ${range(3).map(i => `<div class="row"><span class="bul" style="width:5px;height:5px"></span><input class="ln" data-k="R${d}.n${i}" aria-label="Anotação ${i+1}"></div>`).join('')}
      </section>
    </div>
    <div class="foot">${D.heart}<span>Feito é melhor que perfeito.<br>Celebre cada pequena vitória.</span><span class="leaf-sm">${D.leafPink}</span></div>
  </div>
</section>`;

const book = $('#book'), slotL = $('#slotL'), slotR = $('#slotR');
slotL.innerHTML = range(7).map(leftPage).join('');
slotR.innerHTML = range(7).map(rightPage).join('');
const Lp = [...slotL.children], Rp = [...slotR.children];
const pageOf = (side, d) => (side === 'L' ? Lp : Rp)[d];

/* ---------- campos ---------- */
function fillEl(el){
  const v = S.f[el.dataset.k];
  if (el.type === 'checkbox') el.checked = !!v;
  else el.value = v !== undefined ? v : (el.dataset.def || '');
}
function fillIc(el){ el.innerHTML = I[S.f[el.dataset.ik]] || I[el.dataset.def]; }
function refresh(root = document){ root.querySelectorAll('[data-k]').forEach(fillEl); root.querySelectorAll('[data-ik]').forEach(fillIc); }
function openIcons(btn){
  const k = btn.dataset.ik, def = btn.dataset.def, cur = S.f[k] || def;
  const m = openModal(`<h3>Ícone</h3><div class="icons">${Object.keys(I).map(n => `<button data-n="${n}" class="${n === cur ? 'on' : ''}" aria-label="${n}">${I[n]}</button>`).join('')}</div><div class="mbtns"><button class="btn" data-x>Fechar</button></div>`);
  m.w.querySelector('.icons').onclick = e => {
    const b = e.target.closest('[data-n]'); if (!b) return;
    if (b.dataset.n === def) delete S.f[k]; else S.f[k] = b.dataset.n;
    flush(); fillIc(btn); m.close();
  };
}
function onField(e){
  const el = e.target, k = el.dataset && el.dataset.k;
  if (!k) return;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  const def = el.dataset.def;
  if (def !== undefined ? v === def : empty(v)) delete S.f[k]; else S.f[k] = v;
  save();
}
book.addEventListener('input', onField);
book.addEventListener('change', onField);

const prefix = (s, d) => `${s}${d}.`;
const sideName = s => s === 'L' ? '"Meu Dia"' : '"Plano"';
function pageFields(s, d){
  const p = prefix(s, d), o = {};
  for (const [k, v] of Object.entries(S.f)) if (k.startsWith(p)) o[k.slice(p.length)] = v;
  return o;
}
const hasData = (s, d) => Object.values(pageFields(s, d)).some(v => !empty(v));
function clearPage(s, d){ const p = prefix(s, d); Object.keys(S.f).forEach(k => { if (k.startsWith(p)) delete S.f[k]; }); }

/* ---------- datas automáticas ---------- */
function renderDates(){
  const ws = parse(S.weekStart);
  document.querySelectorAll('.date-in[data-date]').forEach(box => {
    const dt = addDays(ws, +box.dataset.date);
    box.querySelector('.dd').value = pad(dt.getDate());
    box.querySelector('.mm').value = pad(dt.getMonth() + 1);
    box.querySelector('.yy').value = dt.getFullYear();
  });
  $('#wLbl').textContent = weekRange(S.weekStart);
  chips.forEach((c, i) => c.classList.toggle('today', S.weekStart === thisSunday && i === todayIdx));
}
function shiftWeek(n){ S.weekStart = iso(addDays(parse(S.weekStart), 7 * n)); flush(); renderDates(); }
$('#wPrev').onclick = () => shiftWeek(-1);
$('#wNext').onclick = () => shiftWeek(1);

/* ---------- aviso ---------- */
let tt;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400);
}

/* ---------- janelas ---------- */
const stack = [];
function openModal(html, onClose){
  const w = document.createElement('div');
  w.className = 'mwrap';
  w.style.zIndex = 1500 + stack.length * 2;
  w.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(w);
  document.body.classList.add('lock');
  requestAnimationFrame(() => w.classList.add('on'));
  const m = { w, closed: false, close(){
    if (m.closed) return; m.closed = true;
    stack.splice(stack.indexOf(m), 1);
    w.classList.remove('on'); setTimeout(() => w.remove(), 220);
    if (!stack.length) document.body.classList.remove('lock');
    if (onClose) onClose();
  }};
  stack.push(m);
  w.addEventListener('click', e => { if (e.target === w) m.close(); });
  w.querySelectorAll('[data-x]').forEach(b => b.onclick = () => m.close());
  return m;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) stack[stack.length - 1].close(); });
function confirmBox({ title, text = '', ok = 'Confirmar', danger = true }){
  return new Promise(res => {
    let done = false;
    const m = openModal(`<h3>${title}</h3>${text ? `<p>${text}</p>` : ''}<div class="mbtns"><button class="btn" data-x>Cancelar</button><button class="btn ${danger ? 'danger' : 'pri'}" data-ok>${ok}</button></div>`, () => { if (!done) res(false); });
    const okB = m.w.querySelector('[data-ok]');
    okB.onclick = () => { done = true; res(true); m.close(); };
    okB.focus();
  });
}

/* ---------- copiar / colar / limpar ---------- */
function updatePasteDim(){
  document.querySelectorAll('.tbtn[data-act="paste"]').forEach(b => b.classList.toggle('dim', !S.clip || S.clip.side !== b.dataset.side));
}
async function pageAction(act, s, d){
  const page = pageOf(s, d);
  if (act === 'copy') {
    S.clip = { side: s, d, f: pageFields(s, d) };
    flush(); updatePasteDim();
    toast('Copiado!');
  } else if (act === 'paste') {
    if (!S.clip) return toast('Copie uma página primeiro.');
    if (S.clip.side !== s) return toast(`Só dá para colar em ${sideName(S.clip.side)}.`);
    if (S.clip.d === d) return toast('Essa é a página copiada.');
    if (hasData(s, d) && !(await confirmBox({ title: 'Substituir página?', text: 'O conteúdo atual será trocado.', ok: 'Substituir' }))) return;
    clearPage(s, d);
    const p = prefix(s, d);
    for (const [k, v] of Object.entries(S.clip.f)) S.f[p + k] = v;
    flush(); refresh(page);
    toast('Colado!');
  } else if (act === 'clear') {
    if (!hasData(s, d)) return toast('Página já está vazia.');
    if (!(await confirmBox({ title: 'Limpar página?', ok: 'Limpar' }))) return;
    clearPage(s, d); flush(); refresh(page);
    toast('Página limpa.');
  }
}
book.addEventListener('click', e => {
  const ib = e.target.closest('.r-ic');
  if (ib && !ib.closest('.flip')) return openIcons(ib);
  const b = e.target.closest('.tbtn');
  if (!b || !book.contains(b) || b.closest('.flip')) return;
  pageAction(b.dataset.act, b.dataset.side, +b.dataset.d);
});

/* ---------- histórico ---------- */
function slotHTML(i, sel, withDelete){
  const h = S.hist[i];
  const cls = `hslot${h ? ' full' : ''}${sel === i ? ' sel' : ''}`;
  if (!h) return `<div class="${cls}" data-i="${i}" role="button" tabindex="0"><span class="n">${i+1}</span>Vazio</div>`;
  return `<div class="${cls}" data-i="${i}" role="button" tabindex="0"><span class="n">${i+1}</span><b>${weekRange(h.weekStart)}</b><span>salvo ${fmt(new Date(h.savedAt))}</span>${withDelete ? '<button class="x" data-del aria-label="Excluir">×</button>' : ''}</div>`;
}
function slotKeys(box){
  box.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('hslot')) { e.preventDefault(); e.target.click(); }
  });
}
function openHistory(){
  const m = openModal(`<h3>Histórico</h3><div class="slots"></div><div class="mbtns"><button class="btn" data-x>Fechar</button></div>`);
  const box = m.w.querySelector('.slots');
  const draw = () => { box.innerHTML = range(3).map(i => slotHTML(i, -1, true)).join(''); };
  draw(); slotKeys(box);
  box.addEventListener('click', async e => {
    const card = e.target.closest('.hslot'); if (!card) return;
    const i = +card.dataset.i, h = S.hist[i];
    if (!h) return toast('Espaço vazio.');
    if (e.target.closest('[data-del]')) {
      if (await confirmBox({ title: 'Excluir semana?', ok: 'Excluir' })) { S.hist[i] = null; flush(); draw(); }
      return;
    }
    if (await confirmBox({ title: 'Restaurar semana?', text: 'Os dados atuais serão apagados.', ok: 'Restaurar' })) {
      S.f = JSON.parse(JSON.stringify(h.f));
      S.weekStart = h.weekStart;
      flush(); refresh(); renderDates(); m.close();
      toast('Semana restaurada.');
    }
  });
}
function startNewWeek(){
  const keep = {};
  for (const [k, v] of Object.entries(S.f)) if (/^L\d\.r\d+[ti]$/.test(k)) keep[k] = v;
  S.f = keep;
  S.weekStart = (todayIdx >= 5 && S.weekStart === thisSunday) ? iso(addDays(parse(thisSunday), 7)) : thisSunday;
  flush(); refresh(); renderDates();
  pos = (S.weekStart === thisSunday ? todayIdx : 0) * 2;
  render(); keepInView();
}
function openNewWeek(){
  let sel = -1;
  const m = openModal(`<h3>Nova semana</h3><p>Salvar a semana atual no histórico?</p><div class="slots"></div><div class="warn" hidden></div><div class="mbtns"><button class="btn" data-x>Cancelar</button><button class="btn" data-nosave>Não salvar</button><button class="btn pri" data-save disabled>Salvar</button></div>`);
  const box = m.w.querySelector('.slots'), warn = m.w.querySelector('.warn'), saveB = m.w.querySelector('[data-save]');
  const draw = () => {
    box.innerHTML = range(3).map(i => slotHTML(i, sel, false)).join('');
    saveB.disabled = sel < 0;
    warn.hidden = !(sel >= 0 && S.hist[sel]);
    warn.textContent = `O espaço ${sel + 1} será substituído.`;
  };
  draw(); slotKeys(box);
  box.addEventListener('click', e => { const c = e.target.closest('.hslot'); if (c) { sel = +c.dataset.i; draw(); } });
  saveB.onclick = async () => {
    if (S.hist[sel] && !(await confirmBox({ title: 'Sobrescrever?', text: `A semana ${weekRange(S.hist[sel].weekStart)} será apagada.`, ok: 'Sobrescrever' }))) return;
    S.hist[sel] = { savedAt: Date.now(), weekStart: S.weekStart, f: JSON.parse(JSON.stringify(S.f)) };
    startNewWeek(); m.close();
    toast('Semana salva. Nova semana!');
  };
  m.w.querySelector('[data-nosave]').onclick = async () => {
    if (!(await confirmBox({ title: 'Limpar sem salvar?', text: 'Os dados desta semana serão perdidos.', ok: 'Limpar' }))) return;
    startNewWeek(); m.close();
    toast('Nova semana!');
  };
}

/* ---------- cor do app ---------- */
function openTheme(){
  const cur = S.theme || { id: 'rosa' };
  const custom = cur.color || '#9b8ce0';
  const opt = (id, label, bg) => `<button class="th${cur.id === id ? ' on' : ''}" data-t="${id}"><span class="sw" style="background:${bg}"></span>${label}</button>`;
  const m = openModal(`<h3>Cor</h3><div class="themes">
    ${opt('rosa', 'Rosa', 'linear-gradient(135deg,#fbf1ee 50%,#e8889a 50%)')}
    ${opt('bege', 'Bege', 'linear-gradient(135deg,#f9f7ef 50%,#d4b796 50%)')}
    ${opt('azul', 'Azul', 'linear-gradient(135deg,#eef2fb 50%,#86b9de 50%)')}
    <label class="th${cur.id === 'custom' ? ' on' : ''}" data-t="custom"><span class="sw custom"><input type="color" value="${custom}" aria-label="Escolher cor"></span>Outra</label>
  </div><div class="mbtns"><button class="btn pri" data-x>Pronto</button></div>`);
  const mark = id => m.w.querySelectorAll('.th').forEach(b => b.classList.toggle('on', b.dataset.t === id));
  const set = t => { S.theme = t; applyTheme(t); mark(t.id); flush(); };
  m.w.querySelectorAll('button.th').forEach(b => b.onclick = () => set({ id: b.dataset.t, color: S.theme.color }));
  const picker = m.w.querySelector('input[type=color]');
  picker.addEventListener('input', () => set({ id: 'custom', color: picker.value }));
}

/* ---------- navegação e folhear ---------- */
const mq = matchMedia('(min-width: 900px)');
const calcSingle = () => !mq.matches && S.view !== 'book';
let single = calcSingle();
let pos = todayIdx * 2, busy = false;
const maxPos = () => single ? 13 : 12;
const step = () => single ? 1 : 2;
const pageAt = p => (p % 2 ? Rp : Lp)[p >> 1];

const nav = $('#nav');
nav.innerHTML = `<button class="arrow" id="prev" aria-label="Anterior">‹</button>` +
  INI.map((l, i) => `<button class="chip" data-i="${i}" aria-label="${DIAS[i]}">${l}</button>`).join('') +
  `<button class="arrow" id="next" aria-label="Próximo">›</button>`;
const chips = [...nav.querySelectorAll('.chip')];
const tabs = [...document.querySelectorAll('#tabs button')];

function updateNav(p = pos){
  chips.forEach((c, i) => c.classList.toggle('on', i === p >> 1));
  tabs.forEach(t => t.classList.toggle('on', +t.dataset.s === p % 2));
  $('#prev').disabled = p <= 0;
  $('#next').disabled = p >= maxPos();
}
function showOnly(l, r){
  Lp.forEach((p, i) => p.classList.toggle('on', i === l));
  Rp.forEach((p, i) => p.classList.toggle('on', i === r));
}
function showSingle(p){ book.dataset.side = p % 2 ? 'r' : 'l'; showOnly(p % 2 ? -1 : p >> 1, p % 2 ? p >> 1 : -1); }
function render(){
  book.classList.toggle('single', single);
  document.body.classList.toggle('is-single', single);
  document.body.classList.toggle('wide-mob', !mq.matches && !single);
  $('#bView').innerHTML = single ? T.bookI + 'Livro aberto' : T.pageI + 'Uma página';
  if (single) showSingle(pos); else { delete book.dataset.side; showOnly(pos >> 1, pos >> 1); }
  updateNav();
}
function keepInView(){
  const r = book.getBoundingClientRect();
  if (r.top < 0) window.scrollTo({ top: scrollY + r.top - 12, behavior: 'smooth' });
}
function blurBook(){ const a = document.activeElement; if (a && book.contains(a)) a.blur(); }

function cloneFace(page){
  const c = page.cloneNode(true);
  c.classList.add('on');
  c.setAttribute('aria-hidden', 'true');
  const src = page.querySelectorAll('input'), dst = c.querySelectorAll('input');
  src.forEach((s, i) => {
    const t = dst[i];
    t.removeAttribute('data-k'); t.tabIndex = -1;
    if (s.type === 'checkbox') { if (s.checked) t.setAttribute('checked', ''); else t.removeAttribute('checked'); }
    else t.setAttribute('value', s.value);
  });
  c.querySelectorAll('button').forEach(b => b.tabIndex = -1);
  return c;
}
function blank(){ const b = document.createElement('div'); b.className = 'pg pg-blank on'; return b; }

function mkFlip(front, back, a0){
  const el = document.createElement('div'); el.className = 'flip';
  const f = document.createElement('div'); f.className = 'face front'; f.appendChild(front);
  const b = document.createElement('div'); b.className = 'face back'; b.appendChild(back);
  el.append(f, b);
  if (!single) el.style.minHeight = book.offsetHeight + 'px';
  book.appendChild(el);
  const o = {
    a: a0,
    set(a){
      o.a = a;
      el.style.transform = `rotateY(${a}deg)`;
      const t = Math.abs(a) / 180;
      el.style.setProperty('--shf', (t * .6).toFixed(3));
      el.style.setProperty('--shb', ((1 - t) * .6).toFixed(3));
      if (single) el.style.opacity = Math.max(0, Math.min(1, (180 - Math.abs(a)) / 55)).toFixed(3);
    },
    animate(to, cb){
      const from = o.a, dur = Math.max(240, 850 * Math.abs(to - from) / 180), t0 = performance.now();
      const tick = n => {
        let k = Math.min(1, (n - t0) / dur);
        k = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
        o.set(from + (to - from) * k);
        if (k < 1) requestAnimationFrame(tick); else { el.remove(); cb && cb(); }
      };
      requestAnimationFrame(tick);
    }
  };
  o.set(a0);
  return o;
}

function startFlip(t){
  const c = pos, fwd = t > c;
  let fl, end, onRevert = () => {};
  blurBook();
  if (!single) {
    const cd = c >> 1, td = t >> 1;
    if (fwd) { fl = mkFlip(cloneFace(Rp[cd]), cloneFace(Lp[td]), 0); showOnly(cd, td); end = -180; }
    else { fl = mkFlip(cloneFace(Rp[td]), cloneFace(Lp[cd]), -180); showOnly(td, cd); end = 0; }
  } else if (fwd) {
    fl = mkFlip(cloneFace(pageAt(c)), blank(), 0);
    showSingle(t); end = -180;
    onRevert = () => showSingle(c);
  } else {
    fl = mkFlip(cloneFace(pageAt(t)), blank(), -180);
    end = 0;
  }
  const a0 = fl.a;
  return {
    fl,
    finish(done){
      busy = true;
      fl.animate(done ? end : a0, () => {
        if (done) pos = t; else onRevert();
        busy = false; render();
        if (done) keepInView();
      });
    }
  };
}
function go(t){
  t = Math.max(0, Math.min(maxPos(), t));
  if (!single) t &= ~1;
  if (busy || t === pos) return;
  busy = true;
  updateNav(t);
  startFlip(t).finish(true);
}
$('#prev').onclick = () => go(pos - step());
$('#next').onclick = () => go(pos + step());
chips.forEach((c, i) => c.onclick = () => go(i * 2 + (single ? pos % 2 : 0)));
tabs.forEach(b => b.onclick = () => go((pos & ~1) + +b.dataset.s));
document.addEventListener('keydown', e => {
  if (stack.length || (e.target.closest && e.target.closest('input'))) return;
  if (e.key === 'ArrowRight') go(pos + step());
  if (e.key === 'ArrowLeft') go(pos - step());
});

/* arrastar com o dedo: a página acompanha o movimento */
let dr = null;
book.addEventListener('pointerdown', e => {
  if (busy || stack.length || (!mq.matches && !single)) return;
  if (e.pointerType === 'mouse' && (e.button !== 0 || e.target.closest('input,button'))) return;
  dr = { x: e.clientX, y: e.clientY, id: e.pointerId, on: false, prog: 0 };
});
book.addEventListener('pointermove', e => {
  if (!dr || e.pointerId !== dr.id) return;
  const dx = e.clientX - dr.x, dy = e.clientY - dr.y;
  if (!dr.on) {
    if (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)) { dr = null; return; }
    if (Math.abs(dx) < 14 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
    const fwd = dx < 0, t = pos + (fwd ? step() : -step());
    if (busy || t < 0 || t > maxPos()) { dr = null; return; }
    busy = true;
    dr.on = true; dr.fwd = fwd; dr.t = t;
    dr.w = book.clientWidth * (single ? .8 : .45);
    dr.f = startFlip(t);
    try { book.setPointerCapture(e.pointerId); } catch(_) {}
  }
  dr.prog = Math.max(0, Math.min(1, (dr.fwd ? -dx : dx) / dr.w));
  dr.f.fl.set(dr.fwd ? -180 * dr.prog : -180 * (1 - dr.prog));
});
function endDrag(){
  if (!dr) return;
  const d = dr; dr = null;
  if (!d.on) return;
  const done = d.prog > .28;
  if (done) updateNav(d.t);
  d.f.finish(done);
}
book.addEventListener('pointerup', endDrag);
book.addEventListener('pointercancel', endDrag);

mq.addEventListener('change', () => {
  single = calcSingle();
  if (!single) pos &= ~1;
  if (!busy) render();
});

/* ---------- botões do topo ---------- */
$('#bNew').insertAdjacentHTML('afterbegin', T.fresh);
$('#bHist').insertAdjacentHTML('afterbegin', T.hist);
$('#bTheme').insertAdjacentHTML('afterbegin', T.palette);
$('#bInst').insertAdjacentHTML('afterbegin', T.down);
$('#bNew').onclick = openNewWeek;
$('#bHist').onclick = openHistory;
$('#bTheme').onclick = openTheme;
$('#bView').onclick = () => {
  if (busy) return;
  S.view = single ? 'book' : 'page'; flush();
  single = calcSingle();
  if (!single) pos &= ~1;
  render();
};

/* ---------- instalar como app ---------- */
let deferred = null;
const instB = $('#bInst');
if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) instB.hidden = true;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
addEventListener('appinstalled', () => { instB.hidden = true; toast('App instalado!'); });
instB.onclick = async () => {
  if (deferred) { deferred.prompt(); try { await deferred.userChoice; } catch(_) {} deferred = null; return; }
  openModal(`<h3>Instalar</h3><ul>
    <li><b>iPhone:</b> Compartilhar → Adicionar à Tela de Início</li>
    <li><b>Android:</b> menu ⋮ → Instalar app</li></ul>
    <div class="mbtns"><button class="btn pri" data-x>Ok</button></div>`);
};
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

/* ---------- início ---------- */
refresh();
renderDates();
updatePasteDim();
render();
})();
</script>
</body>
</html>
